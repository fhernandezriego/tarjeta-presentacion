<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tarjeta de Presentación</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="card-container">
        <article class="card">
            <header class="card-header">
                <img src="https://via.placeholder.com/150" alt="Foto de perfil" class="profile-img">
                <h1>Tu Nombre Aquí</h1>
                <p class="subtitle">Estudiante de Desarrollo Web</p>
            </header>

            <section class="card-body">
                <p>¡Hola! Estoy aprendiendo HTML, CSS y Git desde cero para dominar el desarrollo frontend.</p>
            </section>

            <footer class="card-footer">
                <a href="https://github.com" target="_blank" class="btn">Mi GitHub</a>
            </footer>
        </article>
    </main>
    <script src="script.js"></script>
</body>

</html>
